# Sobe a solução inteira (Postgres + API + frontend) com um comando:
#   docker compose up -d --build --wait
# Todas as variáveis têm valor padrão; o .env (copiado de .env.example) é opcional.
name: transferencias

services:
  db:
    image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transfers}
      POSTGRES_USER: ${POSTGRES_USER:-transfers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-INSECURE-change-me}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Transfers: Host=db;Port=5432;Database=${POSTGRES_DB:-transfers};Username=${POSTGRES_USER:-transfers};Password=${POSTGRES_PASSWORD:-INSECURE-change-me}
      RUN_SEEDS: ${RUN_SEEDS:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-15080}:8080"
    mem_limit: 384m
    cpus: 1
    pids_limit: 200

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-15173}:80"
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 100

volumes:
  db-data:
