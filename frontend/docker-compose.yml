name: transferencias-frontend

services:
  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:?set API_URL in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${WEB_PORT:-15173}:80"
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 100
